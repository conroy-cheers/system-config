%YAML 1.2
---
$id: http://devicetree.org/schemas/display/waveshare,epd-2in66b.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Waveshare 2.66-inch black, white and red e-paper module

maintainers:
  - Conroy Cheers <conroy@corncheese.org>

description: |
  The module contains a 152 by 296 pixel electrophoretic panel driven over
  four-wire SPI by an SSD1680-family controller. The BUSY output is active
  high and the reset input is active low.

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: waveshare,epd-2in66b

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 10000000

  reset-gpios:
    maxItems: 1

  busy-gpios:
    maxItems: 1

  dc-gpios:
    maxItems: 1

  rotation:
    enum: [0, 90, 180, 270]

required:
  - compatible
  - reg
  - spi-max-frequency
  - reset-gpios
  - busy-gpios
  - dc-gpios

unevaluatedProperties: false

examples:
  - |
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        display@0 {
            compatible = "waveshare,epd-2in66b";
            reg = <0>;
            spi-max-frequency = <4000000>;
            reset-gpios = <&gpio 2 1>;
            busy-gpios = <&gpio 4 0>;
            dc-gpios = <&gpio 6 0>;
            rotation = <90>;
        };
    };
